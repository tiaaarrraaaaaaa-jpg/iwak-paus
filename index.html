<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Ikan Paus</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f9ff;
}

header{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:30px;
}

.card{
    width:300px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:15px;
    text-align:center;
}

.harga{
    color:green;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

button{
    background:#0077b6;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005f8f;
}
</style>
</head>
<body>

<header>
    <h1>Toko Ikan Paus</h1>
    <p>Produk Laut Premium</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1568430462989-44163eb1752f" alt="Ikan Paus">
        <div class="card-content">
            <h2>Ikan Paus Biru</h2>
            <p>Daging paus kualitas premium.</p>
            <p class="harga">Rp 2.500.000 / Kg</p>
            <button>Beli Sekarang</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1516939884455-1445c8652f83" alt="Ikan Paus">
        <div class="card-content">
            <h2>Ikan Paus Orca</h2>
            <p>Produk laut pilihan.</p>
            <p class="harga">Rp 3.000.000 / Kg</p>
            <button>Beli Sekarang</button>
        </div>
    </div>

</div>

</body>
</html>
